<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Aprende chino mandarín en sesiones cortas: repaso espaciado, pinyin coloreado por tono y ejercicios generados.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230B7A5C'/%3E%3Ctext x='50' y='72' font-size='60' text-anchor='middle' fill='white' font-family='serif'%3E%E7%82%B9%3C/text%3E%3C/svg%3E">
<title>Diǎn Diǎn 点点</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Noto+Serif+SC:wght@500;700&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Layout: one narrow study column. Home = path of units drawn on 田字格 practice paper; a session takes over the column. */
:root{
  --bg:#EEF2EF; --surface:#FFFFFF; --sunk:#E3E9E5; --ink:#17201B; --muted:#5B6A62; --line:#CFD8D2;
  --accent:#0B7A5C; --accent-ink:#FFFFFF; --accent-soft:#D5EDE4;
  --good:#1D8A4E; --good-soft:#DDF2E5; --bad:#C0352B; --bad-soft:#F8E1DE;
  --grid:#E2A79C; --gold:#B7791F;
  --t1:#C2410C; --t2:#2563C9; --t3:#7C3AED; --t4:#BE185D; --t0:#7A867F;
  --sky-day:#F5D27A; --sky-night:#33406B; --on-night:#F3F1E8;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --f-han:"Noto Serif SC", "Songti SC", "SimSun", serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1512; --surface:#18201C; --sunk:#222C27; --ink:#E6ECE8; --muted:#9AA9A1; --line:#2F3B35;
  --accent:#3CC59A; --accent-ink:#06261C; --accent-soft:#16372C;
  --good:#4CC883; --good-soft:#163524; --bad:#F2766B; --bad-soft:#3D1E1B;
  --grid:#6E3B33; --gold:#E3B254;
  --t1:#FB9550; --t2:#77A6FF; --t3:#B99BFA; --t4:#F47AB7; --t0:#8E9A93;
  --sky-day:#9C7A2A; --sky-night:#2A3560; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0F1512; --surface:#18201C; --sunk:#222C27; --ink:#E6ECE8; --muted:#9AA9A1; --line:#2F3B35;
  --accent:#3CC59A; --accent-ink:#06261C; --accent-soft:#16372C;
  --good:#4CC883; --good-soft:#163524; --bad:#F2766B; --bad-soft:#3D1E1B;
  --grid:#6E3B33; --gold:#E3B254;
  --t1:#FB9550; --t2:#77A6FF; --t3:#B99BFA; --t4:#F47AB7; --t0:#8E9A93;
  --sky-day:#9C7A2A; --sky-night:#2A3560; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5;padding-inline:16px;padding-block:0 48px}
.wrap{max-width:640px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
.han{font-family:var(--f-han);font-weight:500}
.muted{color:var(--muted)}
.t1{color:var(--t1)}.t2{color:var(--t2)}.t3{color:var(--t3)}.t4{color:var(--t4)}.t0{color:var(--t0)}
.pw{white-space:nowrap}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:12px;padding-block:12px;border-bottom:1px solid var(--line)}
.brand{font-family:var(--f-display);font-weight:800;font-size:20px;display:flex;align-items:baseline;gap:6px}
.brand .han{color:var(--accent);font-weight:700}
.stats{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip svg{width:14px;height:14px}

/* home */
.hero{padding-block:28px 18px;display:grid;gap:6px}
.eyebrow{font-size:13px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.hero .han{font-size:clamp(34px,9vw,52px);font-weight:700;line-height:1.1}
.hero .py{font-size:20px}
.actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-block:4px 28px}
.cta{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;padding:14px 16px;border:0;border-radius:var(--r);background:var(--accent);color:var(--accent-ink);margin-block:4px 22px}
.cta b{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-size:18px}
.cta span{display:block;font-size:14px;opacity:.88;margin-top:2px}
.cta .go{font-size:24px;line-height:1;flex:none}
.cta:hover{filter:brightness(1.08)}
@media (max-width:520px){
  .hero{padding-block:14px 10px;gap:2px}
  .hero .han{font-size:34px}
  .hero .py{font-size:17px}
  .hero .muted{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .act{padding:12px}
  .act b{font-size:16px}
  .unit{grid-template-columns:44px minmax(0,1fr);gap:8px 12px;align-items:start;padding:12px 12px 14px}
  .unit .tzg{width:44px}.unit .tzg .han{font-size:26px}
  .unit > .btn{grid-column:2;justify-self:start;padding:8px 18px}
}
.act{display:grid;gap:4px;text-align:left;padding:14px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);min-width:0}
.act b{font-family:var(--f-display);font-size:17px}
.act span{font-size:14px;color:var(--muted)}
.act.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.act.primary span{color:inherit;opacity:.85}
.act:hover{border-color:var(--accent)}
.sect{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-block:8px 12px}
.sect h2{font-size:20px}
.path{display:grid;gap:10px;list-style:none;padding:0;margin:0}
.unit{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line)}
.unit.next{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.unit h3{font-size:17px}
.unit .ref{font-size:13px;color:var(--muted)}
.unit .stat{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.unit .stat.done{color:var(--good)} .unit .stat.nx{color:var(--accent)}
.lvls{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:8px}
.lv{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:2px 11px;font-size:13px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.lv.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.lv:disabled{opacity:.55;cursor:not-allowed;border-style:dashed}
.lv svg{width:11px;height:11px}
.lvbest{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.unlock{display:grid;gap:4px;padding:12px 16px;border-radius:var(--r);background:var(--accent-soft);border:1px solid var(--accent);max-width:420px}
.unlock b{font-family:var(--f-display);font-size:18px;color:var(--accent)}
.btn{border:0;border-radius:12px;padding:10px 16px;font-weight:700;background:var(--sunk);color:var(--ink)}
.btn.main{background:var(--accent);color:var(--accent-ink)}
.btn.big{width:100%;padding:14px;font-size:18px}
.btn:disabled{opacity:.45;cursor:default}
.method{margin-top:28px;padding:16px;border-radius:var(--r);background:var(--sunk);font-size:15px}
.method h2{font-size:17px;margin-bottom:8px}
.method ol{margin:0;padding-left:20px;display:grid;gap:6px}
.foot{margin-top:14px;font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 14px}
.linkbtn{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;font-size:13px}

/* 田字格 practice square */
.tzg{position:relative;display:inline-grid;place-items:center;aspect-ratio:1;border:2px solid var(--grid);background:var(--surface);
  background-image:linear-gradient(var(--grid),var(--grid)),linear-gradient(var(--grid),var(--grid));
  background-size:100% 1px,1px 100%;background-position:center;background-repeat:no-repeat}
.tzg::after{content:"";position:absolute;inset:0;background:
  linear-gradient(45deg,transparent calc(50% - .5px),color-mix(in srgb,var(--grid) 55%,transparent) 50%,transparent calc(50% + .5px)),
  linear-gradient(-45deg,transparent calc(50% - .5px),color-mix(in srgb,var(--grid) 55%,transparent) 50%,transparent calc(50% + .5px));pointer-events:none}
.tzg .han{position:relative;z-index:1;line-height:1}
.unit .tzg{width:64px}.unit .tzg .han{font-size:38px}
.tzgrow{display:flex;justify-content:center;flex-wrap:wrap}
.tzgrow .tzg{width:clamp(88px,26vw,128px);margin-left:-2px}
.tzgrow .tzg .han{font-size:clamp(56px,17vw,84px)}

/* session */
.sbar{display:flex;align-items:center;gap:12px;padding-block:16px}
.xbtn{background:none;border:0;padding:6px;border-radius:8px;color:var(--muted);display:grid;place-items:center}
.xbtn svg{width:22px;height:22px}
.prog{flex:1;height:12px;border-radius:999px;background:var(--sunk);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .3s}
.card{display:grid;gap:18px;padding-block:8px 24px}
.kind{font-size:13px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.qtext{font-family:var(--f-display);font-size:24px;font-weight:600}
.center{text-align:center;justify-items:center}
.pybig{font-size:26px;font-weight:600}
.es{font-size:19px}
.tip{font-size:15px;background:var(--sunk);border-radius:12px;padding:10px 14px}
.audio{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:600}
.audio svg{width:20px;height:20px;color:var(--accent)}
.audio.huge{padding:22px;border-radius:50%;}
.audio.huge svg{width:44px;height:44px}
.arow{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.opts.wide{grid-template-columns:minmax(0,1fr)}
.opts.wide .opt{min-height:56px;padding:10px}
.opt{border:2px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px 10px;display:grid;gap:2px;justify-items:center;text-align:center;min-height:64px;align-content:center;min-width:0}
.opt .han{font-size:30px}
.opt small{font-size:14px;color:var(--muted)}
.opt .k{font-size:11px;color:var(--muted);justify-self:start;margin-bottom:-14px}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.ok{border-color:var(--good);background:var(--good-soft)}
.opt.no{border-color:var(--bad);background:var(--bad-soft)}
.mods{display:flex;flex-wrap:wrap;gap:4px;padding:4px;border-radius:20px;background:var(--sunk);width:max-content;max-width:100%;margin-top:18px}
.mod{border:0;background:none;border-radius:999px;padding:6px 12px;font-weight:700;font-size:14px;color:var(--muted)}
.sw{display:inline-block;width:52px;height:52px;border-radius:14px;border:2px solid var(--line);vertical-align:middle}
.sw.big{width:120px;height:120px;border-radius:26px}
.tag{display:inline-block;font-family:var(--f-display);font-weight:800;font-size:52px;line-height:1.1;padding:10px 24px;border:3px dashed var(--line);border-radius:18px;font-variant-numeric:tabular-nums}
.pic{font-size:72px;line-height:1.15}
.ask .pic,.ask .sw{display:inline-block;font-size:40px;vertical-align:middle}
.scene{display:grid;grid-template-columns:repeat(3,60px);grid-template-rows:repeat(3,60px);gap:4px;justify-content:center;margin:8px auto}
.scene span{display:grid;place-items:center;font-size:34px;background:var(--sunk);border-radius:12px;line-height:1}
.scene .me{font-family:var(--f-body);font-size:13px;line-height:1.1;color:var(--accent);text-align:center}
.scene.sm{grid-template-columns:repeat(3,34px);grid-template-rows:repeat(3,34px);gap:3px;margin:0}
.scene.sm span{font-size:20px;border-radius:8px}.scene.sm .me{font-size:10px}
.route{display:flex;gap:8px;align-items:center;justify-content:center}
.route i{display:grid;place-items:center;width:48px;height:48px;color:var(--accent)}.route i svg{width:44px;height:44px}
.route.sm i{width:28px;height:28px}.route.sm i svg{width:26px;height:26px}
.wx{display:inline-grid;justify-items:center;gap:2px;padding:12px 24px;border:1px solid var(--line);border-radius:18px;background:var(--surface)}
.wx .wxi{font-size:52px;line-height:1.1}.wx b{font-family:var(--f-display);font-size:28px}.wx small{color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:12px}
.wx.sm{padding:4px 8px;border:0;background:none}.wx.sm .wxi{font-size:30px}.wx.sm b{font-size:18px}
.cal{display:inline-grid;justify-items:center;border:2px solid var(--line);border-top:12px solid var(--bad);border-radius:14px;padding:8px 22px;background:var(--surface)}
.cal small{text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--muted);font-size:12px}.cal b{font-family:var(--f-display);font-size:26px}
.mod.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px color-mix(in srgb,var(--ink) 18%,transparent)}
/* sections: Principiante and HSK 1. HSK 1 gets its own accent so you always know where you are */
.secs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:14px}
.sec{display:grid;gap:2px;text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:var(--r);padding:8px 14px;min-width:0}
.sec b{font-family:var(--f-display);font-size:17px}
.sec small{font-size:13px;color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums}
.sec.on{border-color:var(--accent);background:var(--accent-soft)}
.sec:hover{border-color:var(--accent)}
:root[data-sec="hsk"]{--accent:#4338CA;--accent-ink:#FFFFFF;--accent-soft:#E2E3FB}
@media (prefers-color-scheme: dark){:root[data-sec="hsk"]:not([data-theme="light"]){--accent:#A3ADFF;--accent-ink:#141638;--accent-soft:#242A57}}
:root[data-theme="dark"][data-sec="hsk"]{--accent:#A3ADFF;--accent-ink:#141638;--accent-soft:#242A57}
/* francés */
html.fr .han{font-family:var(--f-display);font-weight:600;letter-spacing:-.01em}
.frbig{font-size:clamp(32px,10vw,48px);line-height:1.1;text-align:center;overflow-wrap:anywhere}
.pron{font-family:var(--f-body);font-weight:600;color:var(--accent);letter-spacing:.02em}
.pron::before{content:"["}.pron::after{content:"]"}
html.fr .opt .han{font-size:20px;line-height:1.25;overflow-wrap:anywhere}
html.fr .tile .han{font-size:20px}
html.fr .unit .tzg .han{font-size:19px;font-weight:700}
html.fr .hero .han{font-size:clamp(28px,8vw,44px)}
html.fr .bubble .han{font-size:21px}
html.fr .qtext.han{font-size:24px}
.langs{display:flex;gap:4px;padding:4px;border-radius:20px;background:var(--sunk);width:max-content;max-width:100%;margin-top:14px}
.lang{border:0;background:none;border-radius:999px;padding:6px 12px;font-weight:700;font-size:14px;color:var(--muted)}
.lang.on{background:var(--accent);color:var(--accent-ink)}
.fiche{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 12px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:15px;margin:0 0 6px;width:100%}
.fiche dt{color:var(--muted);font-weight:600}.fiche dd{margin:0;font-weight:700;overflow-wrap:anywhere}
.bubble{display:grid;gap:4px;justify-items:start;text-align:left;background:var(--sunk);border-radius:16px 16px 16px 4px;padding:12px 16px;max-width:100%}
.bubble .who{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.bubble .han{font-size:26px}
.ask{font-size:18px}
.ask b{font-family:var(--f-display)}
.opt svg.clk{width:84px;height:84px}
.tray{min-height:76px;border-bottom:2px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;padding-bottom:10px}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tile{border:2px solid var(--line);border-bottom-width:4px;background:var(--surface);border-radius:12px;padding:6px 12px;display:grid;justify-items:center;line-height:1.2}
.tile .han{font-size:24px}
.tile small{font-size:13px}
.tile.ghost{visibility:hidden}
.tile:active{transform:translateY(2px)}
input.ans{width:100%;font:inherit;font-size:22px;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink)}
input.ans:focus{border-color:var(--accent);outline:none}
.hint{font-size:14px;color:var(--muted)}
.feed{position:sticky;bottom:0;margin-inline:-16px;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));display:grid;gap:10px;background:var(--bg);border-top:1px solid var(--line)}
.feed.ok{background:var(--good-soft);border-color:var(--good)}
.feed.no{background:var(--bad-soft);border-color:var(--bad)}
.feed h3{font-size:20px}
.feed.ok h3{color:var(--good)} .feed.no h3{color:var(--bad)}
.feed .ansline{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline}
.feed .ansline .han{font-size:24px}
.selfrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.formula{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.formula div{border-radius:10px;padding:8px 12px;display:grid;justify-items:center;background:var(--surface);border:1px solid var(--line)}
.formula small{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.formula .han{font-size:24px}
.formula .op{background:none;border:0;align-self:center;font-size:22px;color:var(--muted);padding:0}
.rules{display:grid;gap:8px;width:100%}
.rule{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;text-align:left}
.rule .han{font-size:24px}
.daybar{width:100%;display:grid;gap:6px}
.daybar .bar{display:flex;height:42px;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.daybar .bar div{display:grid;place-items:center;font-family:var(--f-han);font-size:15px;min-width:0;overflow:hidden;white-space:nowrap}
.daybar .ticks{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.clockwrap{display:flex;align-items:center;gap:14px;justify-content:center;flex-wrap:wrap}
.clockwrap svg.clk{width:150px;height:150px}
.digital{font-variant-numeric:tabular-nums;font-family:var(--f-display);font-size:30px;font-weight:800;display:grid;gap:2px;justify-items:center}
.digital small{font-family:var(--f-body);font-size:14px;font-weight:600;color:var(--muted)}
.result{display:grid;gap:16px;padding-block:40px;text-align:center;justify-items:center}
.result .big{font-family:var(--f-display);font-size:56px;font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums}
.result .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.misslist{display:grid;gap:6px;width:100%;text-align:left}
.misslist div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline}
.misslist .han{font-size:20px}
/* 逢七过 */
.g7num{font-family:var(--f-display);font-weight:800;font-size:88px;line-height:1;font-variant-numeric:tabular-nums}
.timer{height:8px;border-radius:999px;background:var(--sunk);overflow:hidden;width:100%}
.timer i{display:block;height:100%;background:var(--gold)}
.clap{font-family:var(--f-han);font-size:26px;font-weight:700;border:2px solid var(--gold);color:var(--gold);background:var(--surface);border-radius:var(--r);padding:14px;grid-column:1/-1}
.note{font-size:14px;padding:10px 14px;border-radius:12px;background:var(--bad-soft);color:var(--ink)}
.note.ok{background:var(--good-soft)}
.qr{background:#fff;padding:12px;border-radius:14px;width:min(300px,100%);margin-inline:auto}
.qr svg{display:block;width:100%;height:auto}
.code{width:100%;font:13px/1.4 ui-monospace,Consolas,monospace;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--surface);color:var(--ink);resize:vertical;word-break:break-all}
.syncbtns{display:flex;flex-wrap:wrap;gap:8px}
.syncbtns .btn.big{flex:1 1 200px;width:auto}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@keyframes pop{from{transform:scale(.96);opacity:.6}to{transform:none;opacity:1}}
.card>*{animation:pop .18s ease-out}
</style>
</head>
<body>


<div class="wrap">
  <header class="top">
    <div class="brand"><span class="han">点点</span><span>Diǎn Diǎn</span></div>
    <div class="stats" id="stats"></div>
  </header>
  <main id="app"></main>
</div>

<script>
/* ---------- utilities ---------- */
const app = document.getElementById('app');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = a => a[Math.floor(Math.random() * a.length)];
const rint = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const today = () => { const d = new Date(); return Math.floor((d.getTime() - d.getTimezoneOffset() * 60000) / 864e5); };
// language being learned: Chinese (zh) or French (fr). ?lang=fr switches it and is remembered
const LANG = (() => {
  let l = null;
  try { l = new URLSearchParams(location.search).get('lang'); } catch(e) {}
  try { if (l === 'fr' || l === 'zh') localStorage.setItem('dd-lang', l); else l = localStorage.getItem('dd-lang'); } catch(e) {}
  return l === 'fr' ? 'fr' : 'zh';
})();
function setLang(l, hash = ''){ try { localStorage.setItem('dd-lang', l); } catch(e) {} location.href = location.pathname + '?lang=' + l + hash; }
if (LANG === 'fr' && document.documentElement && document.documentElement.classList){ document.documentElement.classList.add('fr'); document.title = 'Diǎn Diǎn · Francés'; }
const ICON = {
  play: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z" fill="currentColor"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>',
  slow: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M9 2h6"/></svg>',
  x: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>',
  fire: '<svg viewBox="0 0 24 24" fill="currentColor" style="color:var(--t1)"><path d="M12 2s5 4.5 5 10a5 5 0 0 1-10 0c0-2.5 1.5-4 1.5-4S9 11 11 11c0-4 1-9 1-9z"/></svg>',
  star: '<svg viewBox="0 0 24 24" fill="currentColor" style="color:var(--gold)"><path d="m12 2 3 7 7 .6-5.3 4.7L18.3 22 12 18l-6.3 4 1.6-7.7L2 9.6 9 9z"/></svg>',
  lock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>',
  cards: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--accent)"><rect x="3" y="6" width="13" height="15" rx="2"/><path d="M8 3h11a2 2 0 0 1 2 2v12"/></svg>'
};

/* ---------- pinyin ---------- */
const TONES = {1:'āēīōūǖĀĒĪŌŪ', 2:'áéíóúǘÁÉÍÓÚ', 3:'ǎěǐǒǔǚǍĚǏǑǓ', 4:'àèìòùǜÀÈÌÒÙ'};
const toneOf = s => { for (const t in TONES) for (const c of TONES[t]) if (s.includes(c)) return +t; return 0; };
// internal pinyin: syllables joined by "·", words by spaces
const pyHTML = p => LANG === 'fr' ? (p ? `<span class="pron">${esc(p)}</span>` : '') : p.split(' ').map(w => '<span class="pw">' + w.split('·').map(s => `<span class="t${toneOf(s)}">${esc(s)}</span>`).join('') + '</span>').join(' ');
const pyPlain = p => p.replace(/·/g, '');
const loose = s => s.replace(/œ/g, 'oe').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/v/g, 'u').replace(/[^a-z]/g, '');
const strict = s => s.normalize('NFC').toLowerCase().replace(/[\s·'’?？.,。!！]/g, '');

/* ---------- numbers & time ---------- */
const NZH = ['', '一','二','三','四','五','六','七','八','九','十'];
const NPY = ['', 'yī','èr','sān','sì','wǔ','liù','qī','bā','jiǔ','shí'];
function numZh(n){ if (n <= 10) return NZH[n]; const t = Math.floor(n/10), o = n % 10; return (t > 1 ? NZH[t] : '') + '十' + (o ? NZH[o] : ''); }
function numPy(n){ if (n <= 10) return NPY[n]; const t = Math.floor(n/10), o = n % 10; return [t > 1 ? NPY[t] : null, 'shí', o ? NPY[o] : null].filter(Boolean).join('·'); }
const h12 = h => (h % 12) || 12;
const hourZh = h => (h12(h) === 2 ? '两' : numZh(h12(h))) + '点';
const hourPy = h => (h12(h) === 2 ? 'liǎng' : numPy(h12(h))) + ' diǎn';
const PERIODS = [
  {id:'zs', h:'早上', p:'zǎo·shang', from:5,  to:8,  es:'mañana temprano'},
  {id:'sw', h:'上午', p:'shàng·wǔ',  from:9,  to:11, es:'media mañana'},
  {id:'zw', h:'中午', p:'zhōng·wǔ',  from:12, to:12, es:'mediodía'},
  {id:'xw', h:'下午', p:'xià·wǔ',    from:13, to:17, es:'tarde'},
  {id:'ws', h:'晚上', p:'wǎn·shang', from:18, to:23, es:'noche'}
];
const periodOf = h => PERIODS.find(p => h >= p.from && h <= p.to);
const isDay = h => h >= 6 && h < 18;
function clockSVG(h, opts = {}){
  const a = (h % 12) * 30, sky = opts.sky;
  const rad = d => (d - 90) * Math.PI / 180;
  const hx = 50 + 24 * Math.cos(rad(a)), hy = 50 + 24 * Math.sin(rad(a));
  let ticks = '';
  for (let i = 0; i < 12; i++){ const r1 = i % 3 ? 40 : 36; ticks += `<line x1="${50+r1*Math.cos(rad(i*30))}" y1="${50+r1*Math.sin(rad(i*30))}" x2="${50+44*Math.cos(rad(i*30))}" y2="${50+44*Math.sin(rad(i*30))}" stroke="var(--ink)" stroke-width="${i%3?1.5:3}" stroke-linecap="round"/>`; }
  let skyMark = '';
  if (sky){
    skyMark = isDay(h)
      ? `<circle cx="50" cy="70" r="6" fill="var(--sky-day)" stroke="var(--gold)" stroke-width="1.5"/>`
      : `<path d="M53 64a7 7 0 1 0 0 12a5.5 5.5 0 1 1 0-12z" fill="var(--sky-night)" stroke="var(--muted)" stroke-width="1"/>`;
  }
  return `<svg class="clk" viewBox="0 0 100 100" role="img" aria-label="Reloj marcando las ${h12(h)}"><circle cx="50" cy="50" r="47" fill="var(--surface)" stroke="var(--ink)" stroke-width="3"/>${ticks}${skyMark}<line x1="50" y1="50" x2="50" y2="14" stroke="var(--muted)" stroke-width="2.5" stroke-linecap="round"/><line x1="50" y1="50" x2="${hx}" y2="${hy}" stroke="var(--accent)" stroke-width="5" stroke-linecap="round"/><circle cx="50" cy="50" r="3.5" fill="var(--ink)"/></svg>`;
}
const fmt24 = h => String(h).padStart(2,'0') + ':00';

/* ---------- content · Ruta 1: la hora y tu día ---------- */
const ITEMS = {};
const W = (id, unit, h, p, es, tip) => (ITEMS[id] = {id, unit, kind:'word', h, p, es, tip});
// Unidad 1
W('n1','u1','一','yī','uno (1)','Un solo trazo horizontal.');
W('n2','u1','二','èr','dos (2)','Dos trazos. Para decir la hora se usa otra palabra: 两.');
W('n3','u1','三','sān','tres (3)','Tres trazos.');
W('n4','u1','四','sì','cuatro (4)','Suena casi como 死 sǐ, “morir”; por eso el 4 se considera de mala suerte.');
W('n5','u1','五','wǔ','cinco (5)','Con la mano: palma abierta, los cinco dedos.');
W('n6','u1','六','liù','seis (6)','Con la mano: solo pulgar y meñique extendidos.');
W('n7','u1','七','qī','siete (7)','Con la mano: las puntas de pulgar, índice y medio juntas.');
W('n8','u1','八','bā','ocho (8)','Con la mano: pulgar e índice en forma de L.');
W('n9','u1','九','jiǔ','nueve (9)','Con la mano: el índice doblado como un gancho.');
W('n10','u1','十','shí','diez (10)','Parece una cruz (+). Con la mano: índices cruzados o el puño cerrado.');
// Unidad 2
W('n11','u2','十一','shí·yī','once (11)','10 + 1: primero 十, luego la unidad.');
W('n20','u2','二十','èr·shí','veinte (20)','2 × 10: el número va ANTES de 十.');
W('n21','u2','二十一','èr·shí·yī','veintiuno (21)','2 × 10 + 1.');
W('n99','u2','九十九','jiǔ·shí·jiǔ','noventa y nueve (99)','9 × 10 + 9. Con esto ya cuentas hasta 99.');
ITEMS['g-num'] = {id:'g-num', unit:'u2', kind:'gen', es:'números del 11 al 99'};
// Unidad 3
W('xz','u3','现在','xiàn·zài','ahora','Se pone al inicio: 现在… = “ahora…”.');
W('ji','u3','几','jǐ','¿cuántos? (pregunta por un número)','Va donde iría el número de la respuesta.');
W('dian','u3','点','diǎn','… en punto / hora','Número + 点 = la hora: 三点 = las 3.');
W('jd','u3','几点','jǐ diǎn','¿qué hora? / ¿a qué hora?','几 + 点: “¿cuántas horas?”.');
W('ld','u3','两点','liǎng diǎn','las dos (en punto)','¡Ojo! Para la hora se dice 两 liǎng, nunca 二点.');
W('xzjd','u3','现在几点？','xiàn·zài jǐ diǎn','¿Qué hora es ahora?','Literal: “¿ahora cuántas horas?”. No hace falta verbo “ser”.');
ITEMS['g-time'] = {id:'g-time', unit:'u3', kind:'gen', es:'decir la hora'};
// Unidad 4
W('zs','u4','早上','zǎo·shang','mañana temprano (≈ 5–8 h)','早 = temprano. Se usa para las primeras horas.');
W('sw','u4','上午','shàng·wǔ','media mañana (≈ 9–11 h)','上 = antes · 午 = mediodía → “antes del mediodía”, como a.m.');
W('zw','u4','中午','zhōng·wǔ','mediodía (≈ 12 h)','中 = centro → el centro del día.');
W('xw','u4','下午','xià·wǔ','tarde (≈ 13–17 h)','下 = después → “después del mediodía”, como p.m.');
W('ws','u4','晚上','wǎn·shang','noche (desde ≈ 18 h)','晚 = tarde, de noche.');
ITEMS['g-period'] = {id:'g-period', unit:'u4', kind:'gen', es:'hora con periodo del día'};
// Unidad 5
W('wo','u5','我','wǒ','yo','La palabra más útil: con ella empiezan casi todas tus frases.');
W('qc','u5','起床','qǐ·chuáng','levantarse','起 = levantar · 床 = cama → “levantarse de la cama”.');
W('gz','u5','工作','gōng·zuò','trabajar','También significa “trabajo”.');
W('hj','u5','回家','huí·jiā','volver a casa','回 = volver · 家 = casa.');
W('sj','u5','睡觉','shuì·jiào','dormir, irse a dormir','睡 lleva 目 (ojo) a la izquierda: cerrar los ojos.');
W('qu','u5','去','qù','ir','去 + lugar: 去学校 = ir a la escuela.');
W('xx','u5','学校','xué·xiào','escuela','学 = estudiar · 校 = escuela.');
// Unidad 6
W('chi','u6','吃','chī','comer','Lleva 口 (boca) a la izquierda.');
W('zf','u6','早饭','zǎo·fàn','desayuno','早 = temprano · 饭 = comida.');
W('wf','u6','午饭','wǔ·fàn','almuerzo','午 = mediodía (como en 中午) + 饭.');
W('wanf','u6','晚饭','wǎn·fàn','cena','晚 = noche (como en 晚上) + 饭.');
// Unidad 7: frases completas sobre tu día
const C = (h, p) => ({h, p});
const ch = {
  wo:C('我','wǒ'), ni:C('你','nǐ'), xz:C('现在','xiàn·zài'), jd:C('几点','jǐ diǎn'), chi:C('吃','chī'), qu:C('去','qù'), xx:C('学校','xué·xiào'),
  qc:C('起床','qǐ·chuáng'), gz:C('工作','gōng·zuò'), hj:C('回家','huí·jiā'), sj:C('睡觉','shuì·jiào'),
  zf:C('早饭','zǎo·fàn'), wf:C('午饭','wǔ·fàn'), wanf:C('晚饭','wǎn·fàn')
};
PERIODS.forEach(p => ch[p.id] = C(p.h, p.p));
const hc = h => C(hourZh(h), hourPy(h));
const S_ = (id, chunks, es, q, unit) => (ITEMS[id] = {id, unit:unit || 'u7', kind:'sent', chunks, es, q:!!q,
  h: chunks.map(c => c.h).join('') + (q ? '？' : '。'), p: chunks.map(c => c.p).join(' ')});
S_('s1', [ch.xz, ch.jd], '¿Qué hora es ahora?', 1);
S_('s2', [ch.xz, ch.ws, hc(20)], 'Ahora son las 8 de la noche.');
S_('s3', [ch.wo, ch.zs, hc(7), ch.qc], 'Me levanto a las 7 de la mañana.');
S_('s4', [ch.wo, ch.zs, hc(7), ch.chi, ch.zf], 'Desayuno a las 7 de la mañana.');
S_('s5', [ch.wo, ch.sw, hc(9), ch.gz], 'Trabajo a las 9 de la mañana.');
S_('s6', [ch.wo, ch.zw, hc(13), ch.chi, ch.wf], 'Almuerzo a la 1 del mediodía.');
S_('s7', [ch.wo, ch.xw, hc(18), ch.hj], 'Vuelvo a casa a las 6 de la tarde.');
S_('s8', [ch.wo, ch.ws, hc(20), ch.chi, ch.wanf], 'Ceno a las 8 de la noche.');
S_('s9', [ch.wo, ch.ws, hc(22), ch.sj], 'Me voy a dormir a las 10 de la noche.');
S_('s10', [ch.ni, ch.jd, ch.hj], '¿A qué hora vuelves a casa?', 1);
const DISTRACT = [ch.zs, ch.sw, ch.zw, ch.xw, ch.ws, ch.chi, ch.qu, ch.qc, ch.gz, ch.hj, ch.sj, ch.zf, ch.wf, ch.wanf, hc(14), hc(9), hc(4), ch.ni, ch.wo];

const UNITS = [
  {id:'u1', key:'七', title:'Números 1–10', zh:'一二三', ref:'Contar del 1 al 10, también con una mano', items:['n1','n2','n3','n4','n5','n6','n7','n8','n9','n10'],
   intro:[{type:'hands'}]},
  {id:'u2', key:'十', title:'Números 11–99', zh:'十一 … 九十九', ref:'Decenas: todo se arma con 十', items:['n11','n20','n21','n99','g-num'],
   intro:[{type:'numrules'}]},
  {id:'u3', key:'点', title:'¿Qué hora es?', zh:'现在几点？', ref:'Número + 点', items:['xz','ji','dian','jd','ld','xzjd','g-time'],
   intro:[{type:'timerule'}]},
  {id:'u4', key:'午', title:'Mañana, tarde y noche', zh:'早上 上午 中午 下午 晚上', ref:'Las cinco partes del día', items:['zs','sw','zw','xw','ws','g-period'],
   intro:[{type:'daybar'}]},
  {id:'u5', key:'床', title:'Mi rutina', zh:'起床 工作 回家 睡觉', ref:'Verbos de todos los días', items:['wo','qc','gz','hj','sj','qu','xx'], intro:[]},
  {id:'u6', key:'饭', title:'Las comidas del día', zh:'吃早饭 吃午饭 吃晚饭', ref:'Desayuno, almuerzo y cena', items:['chi','zf','wf','wanf'], intro:[]},
  {id:'u7', key:'校', title:'Tu día en oraciones', zh:'你几点回家？', ref:'Frases completas sobre tu día', models:['s3','s10'], items:['s1','s2','s3','s4','s5','s6','s7','s8','s9','s10'],
   intro:[{type:'grammar'}]}
];

/* ---------- content · Ruta 2: comida y bebida ---------- */
UNITS.forEach(u => u.mod = 'm2');
// c1 主食
W('sm','c1','什么','shén·me','¿qué?','Va donde iría la respuesta: 你吃什么？ → 我吃饺子。 No se mueve al inicio como en español.');
W('jz','c1','饺子','jiǎo·zi','jiaozi (empanadillas chinas)','El plato del Año Nuevo en el norte de China. 子 zi va átono.');
W('bz','c1','包子','bāo·zi','baozi (bollos al vapor rellenos)','包 = envolver. Otra vez 子 átono, como en 饺子.');
W('mt','c1','面条','miàn·tiáo','fideos','面 = fideos/harina · 条 = tira larga.');
W('cm','c1','炒面','chǎo·miàn','fideos salteados (chaomian)','炒 = saltear en wok.');
W('cf','c1','炒饭','chǎo·fàn','arroz frito','炒 saltear + 饭 arroz. Del cantonés “chau faan” viene el chaufa peruano.');
W('ncsm','c1','你吃什么？','nǐ chī shén·me','¿Qué comes? / ¿Qué vas a comer?','La pregunta del mesero. Respondes igual, cambiando 什么 por la comida.');
// c2 吗 y 不
W('ma','c2','吗','ma','¿…? (pregunta de sí o no)','Frase + 吗 = pregunta. 你吃饺子。→ 你吃饺子吗？');
W('bu','c2','不','bù','no (antes del verbo)','Va antes del verbo: 我不吃. Antes de un 4.º tono suena bú: 不要 bú yào.');
W('xie','c2','谢谢','xiè·xie','gracias','El segundo 谢 es átono.');
W('pma','c2','你吃饺子吗？','nǐ chī jiǎo·zi ma','¿Comes jiaozi?','Igual que la afirmación, con 吗 al final.');
W('pneg','c2','我不吃饺子。','wǒ bù chī jiǎo·zi','No como jiaozi.','不 justo antes del verbo.');
W('pbx','c2','不，谢谢。','bù, xiè·xie','No, gracias.','');
// c3 水果
W('xh','c3','喜欢','xǐ·huan','gustar','我喜欢苹果 = “yo gusto manzanas”: quien siente el gusto va primero.');
W('sg','c3','水果','shuǐ·guǒ','fruta','水 agua + 果 fruto: “frutos jugosos”.');
W('pg','c3','苹果','píng·guǒ','manzana','Mismo 果 que en 水果.');
W('xj','c3','香蕉','xiāng·jiāo','plátano','香 = aromático.');
W('cz','c3','橙子','chéng·zi','naranja','chéng con “ng” al final y tono que sube; no “chen”.');
W('nxhsg','c3','你喜欢什么水果？','nǐ xǐ·huan shén·me shuǐ·guǒ','¿Qué fruta te gusta?','什么 + sustantivo = ¿qué …?: 什么水果 = ¿qué fruta?');
// c4 肉和蔬菜
W('yao','c4','要','yào','querer, pedir (en tienda o restaurante)','Lo que dices al comprar o pedir: 我要鸡肉.');
W('nr','c4','牛肉','niú·ròu','carne de res','牛 = vaca · 肉 = carne.');
W('jr','c4','鸡肉','jī·ròu','pollo','鸡 = gallina + 肉.');
W('zr','c4','猪肉','zhū·ròu','cerdo','zhū con “zh” (lengua hacia atrás), no “zu”.');
W('yu','c4','鱼','yú','pescado','yú: labios redondos (ü) y tono que sube.');
W('sc','c4','蔬菜','shū·cài','verduras','');
W('nysm','c4','你要什么？','nǐ yào shén·me','¿Qué quieres? / ¿Qué va a llevar?','La pregunta del vendedor en el mercado.');
W('by','c4','不要','bú·yào','no quiero','不 + 4.º tono → bú. Se escribe igual; cambia el sonido.');
// c5 饮料
W('he','c5','喝','hē','beber','Lleva 口 (boca), como 吃.');
W('sh','c5','水','shuǐ','agua','Ya lo viste en 水果. Tercer tono: baja y sube.');
W('kl','c5','可乐','kě·lè','Coca-Cola','kě lè con tonos 3 y 4, no plano. Literal: “puede alegrar”.');
W('kf','c5','咖啡','kā·fēi','café','Préstamo por sonido: kā fēi ≈ café.');

const buC = V => C('不', toneOf(V.v.p.split('·')[0]) === 4 ? 'bú' : 'bù');

  ans: (V, n) => V.like ? `Me ${gus(n)}.` : `${cap(V.yo)} ${n.es}.`,
  ma: (V, n) => V.like ? `¿Te ${gus(n)}?` : `¿${cap(V.tu)} ${n.es}?`,
  neg: (V, n) => V.like ? `No, no me ${gus(n)}.` : `No, ${V.no} ${n.es}.`,
  yes: (V, n) => V.like ? `Sí, me ${gus(n)}.` : `Sí, ${V.yo} ${n.es}.`,
  swap: (V, n, m) => V.like ? `No, no me ${gus(n)}; me ${gus(m)}.` : `No, ${V.no} ${n.es}; ${V.yo} ${m.es}.`

function food(form, V, n, m){
  let chunks, end = '。';
  if (form === 'what'){ chunks = V.qwh || [k3.ni, V.v, k3.sm]; end = '？'; }
  else if (form === 'ma'){ chunks = [k3.ni, V.v, n.c, k3.ma]; end = '？'; }
  else if (form === 'neg') chunks = [C('不，', 'bù'), k3.wo, buC(V), V.v, n.c];
  else if (form === 'yes') chunks = [C(V.v.h + '，', V.v.p), k3.wo, V.v, n.c];
  else if (form === 'swap') chunks = [C('不，', 'bù'), k3.wo, buC(V), V.v, C(n.c.h + '，', n.c.p), k3.wo, V.v, m.c];
  else chunks = [k3.wo, V.v, n.c];
  const es = form === 'what' ? V.q : es3[form] ? es3[form](V, n, m) : es3.ans(V, n);
  return {form, V, n, m, chunks, es, h:chunks.map(c => c.h).join('') + end, p:chunks.map(c => c.p).join(' ')};

  }

  return {h:'一百' + (r === 10 ? '一十' : r ? numZh(r) : '') + '块', p:'yì·bǎi' + (r === 10 ? ' yī·shí' : r ? ' ' + numPy(r) : '') + ' kuài'};

const IS_SAFARI = typeof navigator !== 'undefined' && /^((?!chrome|chromium|crios|fxios|android).)*safari/i.test(navigator.userAgent);
let WORDSET = null;
function slowText(text){
  if (!WORDSET){
    WORDSET = new Set();
    const add = h => { const w = String(h || '').replace(/[，。？\s]/g, ''); if (w.length > 1) WORDSET.add(w); };
    Object.values(ITEMS).forEach(it => { if (it.kind === 'word') add(it.h); (it.chunks || []).forEach(c => add(c.h)); });
    [...DISTRACT, ...DISTRACT3, ...DISTRACT1, ...D4, ...D5, ...D6, ...D7, ...(typeof DK === 'undefined' ? [] : DK), ...NAMES.map(n => n.c)].forEach(c => add(c.h));
  }
  return text.split(/([，。？！、])/).map(part => {
    if (/^[，。？！、]?$/.test(part)) return part;
    const out = [];
    for (let i = 0; i < part.length;){
      let n = Math.min(3, part.length - i);
      while (n > 1 && !WORDSET.has(part.slice(i, i + n))) n--;
      out.push(part.slice(i, i + n)); i += n;
    }
    return out.join('，');
  }).join('');

function frSlow(text){

  const w = text.split(/\s+/);

function say(text, rate = 0.85){

    if (LANG === 'fr'){
      text = String(text).replace(/，/g, ', ').replace(/_/g, ' ');
      if (rate === 'slow') { text = frSlow(text); rate = IS_SAFARI ? 0.5 : 0.6; }
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'fr-FR'; u.rate = rate === 0.85 ? 0.95 : rate; if (frVoice) u.voice = frVoice;
      speechSynthesis.speak(u);

    }
    if (rate === 'slow') { text = slowText(text); rate = IS_SAFARI ? 0.3 : 0.45; }
    const u = new SpeechSynthesisUtterance(text.replace(/[？。]/g, ''));
    u.lang = 'zh-CN'; u.rate = rate; if (zhVoice) u.voice = zhVoice;

}

function sameUnitWords(it, n){

  let pool = shuffle(Object.values(ITEMS).filter(x => fair(x) && x.unit === it.unit));
  if (pool.length < n) pool = pool.concat(shuffle(Object.values(ITEMS).filter(x => fair(x) && x.unit !== it.unit)));
  const out = [];
  for (const x of pool) if (out.length < n && !out.some(o => o.h === x.h || o.es === x.es || loose(o.p) === loose(x.p))) out.push(x);

  let c = it.es.replace(/\s*\(([^)]*)\)/g, (m, inner) => loose(inner) === key ? '' : m).trim();
  const m = c.match(/^(\S+)\s*\((.*)\)$/);

function kGen(item, unit, es, pool, spec){

      }

  L2_GEN[item] = spec.modes2 || ['listen','reply','build'];

// final exam of the section: like the HSK 1 test, listening and reading from all six routes
function examPlanHSK(){
  LV = 1;
  const mods = Object.keys(MODULES).filter(k => MODULES[k].sec === 'hsk');
  const all = UNITS.filter(u => mods.includes(u.mod)).flatMap(u => u.items), ex = [];
  shuffle(all.filter(id => ITEMS[id].kind === 'sent')).slice(0, 8).forEach(id => ex.push(exFor(id, pick(['build','listen']))));
  shuffle(all.filter(id => ITEMS[id].kind === 'gen')).slice(0, 14).forEach(id => ex.push(exFor(id, pick(GEN_MODES[id].filter(m => m !== 'speak' && m !== 'ask')))));
  shuffle(all.filter(id => ITEMS[id].kind === 'word')).slice(0, 8).forEach(id => ex.push(exFor(id, pick(['listen','meaning','hanzi']))));
  return {title:'Examen final HSK 1', exam:true, examKey:'examHSK1', cards:[], ex:shuffle(ex)};
}

    <div class="formula"><div><small>quién</small><span class="han">我</span></div><div><small>cuándo</small><span class="han">早上六点</span></div><div><small>qué hace</small><span class="han">起床</span></div></div>
    <p class="es">En español decimos “me levanto <i>a las 6</i>”. En chino es “yo <i>a las 6 de la mañana</i> me levanto”. La hora nunca va al final.</p>
    <div class="tip">Para preguntar, pon 几点 justo donde iría la hora: 你<b>几点</b>去学校？</div></div>`;
  return '';
}

/* ---------- session engine ---------- */
let screen = 'home', sess = null;
function startSession(plan){
  sess = {...plan, ci:0, i:0, queue:plan.ex.slice(), firstTry:{}, misses:[], correct:0, answered:0, retries:{}, firstN:0, firstOk:0};
  screen = 'session';
  if (!sess.queue.length) return renderHome();
  renderStep();
}
function totalSteps(){ return sess.cards.length + sess.queue.length; }
function doneSteps(){ return sess.ci + sess.i; }
function header(){
  return `<div class="sbar"><button class="xbtn" id="quit" aria-label="Salir">${ICON.x}</button><div class="prog"><i style="width:${Math.round(100 * doneSteps() / totalSteps())}%"></i></div><span class="chip">${esc(sess.title)}${sess.level ? ' · N' + sess.level : ''}</span></div>`;
}
function renderStep(){
  window.scrollTo(0, 0);
  if (sess.ci < sess.cards.length){
    const c = sess.cards[sess.ci];
    app.innerHTML = header() + cardHTML(c) + `<div class="feed"><button class="btn main big" id="next">${sess.ci === sess.cards.length - 1 ? 'Empezar práctica' : 'Siguiente'}</button></div>`;
    bindQuit();
    if (c.type === 'word' || c.type === 'sent') say(ITEMS[c.id].h);
    document.getElementById('next').onclick = () => { sess.ci++; renderStep(); };
    document.getElementById('next').focus({preventScroll:true});
    return;
  }
  if (sess.i >= sess.queue.length) return finish();
  renderEx(sess.queue[sess.i]);
}
function bindQuit(){ document.getElementById('quit').onclick = () => { if (window.speechSynthesis) speechSynthesis.cancel(); screen = 'home'; renderHome(); }; }

// tiles like 喜欢， and 喜欢 differ only by the comma: where it lands must not decide the answer
const noPunct = t => String(t).replace(/[，。？！、,.?!;:«»…\s]/g, '');
function renderEx(ex){
  let body = `<div class="card${ex.t === 'tiles' || ex.t === 'type' || ex.t === 'digits' ? '' : ''}"><div class="kind">${esc(ex.kind)}</div><div class="card center" style="padding:0">${ex.q}</div>`;
  if (ex.t === 'mc'){
    body += `<div class="opts${ex.wide ? ' wide' : ''}" role="group">${ex.options.map((o, k) => `<button class="opt" data-v="${esc(o.v)}"><span class="k">${k + 1}</span>${o.html}</button>`).join('')}</div>`;
  } else if (ex.t === 'tiles'){
    body += `<div class="tray" id="tray" aria-label="Tu respuesta"></div><div class="bank" id="bank">${ex.bank.map((b, k) => `<button class="tile" data-k="${k}"><span class="han">${esc(b.h)}</span>${b.p && LV < 2 ? `<small>${pyHTML(b.p)}</small>` : ''}</button>`).join('')}</div>`;
  } else if (ex.t === 'type' || ex.t === 'digits'){
    body += `<div><input class="ans" id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" ${ex.t === 'digits' ? 'inputmode="numeric" placeholder="Ej.: 47"' : `placeholder="${esc(ex.ph || 'Ej.: xian zai o xiàn zài')}"`}><div class="hint" style="margin-top:6px">${ex.t === 'type' ? (ex.hint || 'Los tonos son opcionales. Si los escribes bien, te lo digo.') : (ex.hint || 'Escribe el número con cifras.')}</div></div>`;
  } else if (ex.t === 'speak'){
    body += '';
  }
  body += '</div>';
  const foot = ex.t === 'speak'
    ? `<div class="feed" id="feed"><button class="btn main big" id="check">Mostrar respuesta</button></div>`
    : `<div class="feed" id="feed"><button class="btn main big" id="check" disabled>Comprobar</button></div>`;
  app.innerHTML = header() + body + foot;
  bindQuit();
  if (ex.say) setTimeout(() => say(ex.say), 250);
  const check = document.getElementById('check');
  let value = null;
  if (ex.t === 'mc'){
    app.querySelectorAll('.opt').forEach(b => b.onclick = () => {
      if (sess.locked) return;
      app.querySelectorAll('.opt').forEach(x => x.classList.remove('sel'));
      b.classList.add('sel'); value = b.dataset.v; check.disabled = false;
      const o = ex.options.find(o => String(o.v) === value);
      if (o.say && LV < 2) say(o.say);
    });
  } else if (ex.t === 'tiles'){
    const tray = document.getElementById('tray'), bank = document.getElementById('bank');
    const placed = [];
    const sync = () => { value = placed.map(k => ex.bank[k].h).join(''); check.disabled = !placed.length; };
    bank.querySelectorAll('.tile').forEach(b => b.onclick = () => {
      if (sess.locked || b.classList.contains('ghost')) return;
      const k = +b.dataset.k; placed.push(k); b.classList.add('ghost');
      const t = b.cloneNode(true); t.classList.remove('ghost');
      t.onclick = () => { if (sess.locked) return; placed.splice(placed.indexOf(k), 1); t.remove(); b.classList.remove('ghost'); sync(); };
      tray.appendChild(t); say(ex.bank[k].h, 1); sync();
    });
  } else if (ex.t === 'type' || ex.t === 'digits'){
    const inp = document.getElementById('ans');
    inp.oninput = () => { value = inp.value; check.disabled = !inp.value.trim(); };
    inp.focus({preventScroll:true});
  }
  sess.locked = false;
  check.onclick = () => {
    if (ex.t === 'speak') return showSelfGrade(ex);
    let ok = false, perfect = false;
    if (ex.t === 'mc') ok = String(value) === String(ex.answer);
    else if (ex.t === 'tiles') ok = [].concat(ex.answer).some(a => noPunct(a).toLowerCase() === noPunct(value).toLowerCase());
    else if (ex.t === 'digits') ok = value.replace(/\D/g, '') === ex.answer;
    else { const hit = [].concat(ex.answer).find(a => loose(value) === loose(a)); ok = hit != null; perfect = ok && strict(value) === strict(hit); }
    if (ex.t === 'mc') app.querySelectorAll('.opt').forEach(b => { if (b.dataset.v === String(ex.answer)) b.classList.add('ok'); else if (b.dataset.v === value) b.classList.add('no'); });
    grade(ex, ok, perfect);
  };
}
function revHTML(r){ return `<div class="ansline"><span class="han">${esc(r.h)}</span><span>${pyHTML(r.p)}</span><span class="muted">${esc(r.es)}</span>${`<button class="audio" data-say="${esc(r.h)}" aria-label="Escuchar">${ICON.play}</button>`}</div>`; }
function showSelfGrade(ex){
  sess.locked = true;
  const feed = document.getElementById('feed');
  feed.innerHTML = `<h3>¿Lo dijiste así?</h3>${revHTML(ex.rev)}<div class="selfrow"><button class="btn" id="sgNo">Me equivoqué</button><button class="btn main" id="sgOk">Lo dije bien</button></div>`;
  say(ex.rev.h);
  document.getElementById('sgOk').onclick = () => advance(ex, true);
  document.getElementById('sgNo').onclick = () => advance(ex, false);
}
function grade(ex, ok, perfect){
  sess.locked = true;
  const feed = document.getElementById('feed');
  feed.className = 'feed ' + (ok ? 'ok' : 'no');
  const praise = LANG === 'fr' ? (perfect ? '¡Perfecto, con tildes!' : pick(['¡Bien!', '¡Correcto!', 'Très bien !', 'Bravo !'])) : perfect ? '¡Perfecto, con tonos!' : pick(['¡Bien!', '¡Correcto!', '¡Eso es!', '对！ Duì!']);
  feed.innerHTML = `<h3>${ok ? praise : 'Respuesta correcta:'}</h3>${revHTML(ex.rev)}${!ok && !sess.exam ? '<div class="hint">La volverás a ver antes de terminar.</div>' : ''}<button class="btn main big" id="cont">Continuar</button>`;
  say(ex.rev.h);
  const c = document.getElementById('cont'); c.focus({preventScroll:true});
  c.onclick = () => advance(ex, ok);
}
function advance(ex, ok){
  const id = ex.item;
  sess.answered++;
  if (ok) { sess.correct++; S.xp += 1; }
  if (!ex.retry){ sess.firstN++; if (ok) sess.firstOk++; }
  if (!(id in sess.firstTry)) sess.firstTry[id] = ok;
  else if (!ok) sess.firstTry[id] = false;
  if (!ok){
    if (!sess.misses.some(m => m.h === ex.rev.h)) sess.misses.push(ex.rev);
    sess.retries[id] = (sess.retries[id] || 0) + 1;
    if (!sess.exam && sess.retries[id] <= 2){
      const again = ex.redo ? ex.redo() : exFor(id);
      again.retry = true; again.redo = ex.redo;
      sess.queue.push(again);
    }
  }
  sess.i++;
  renderStep();
}
function finish(){
  const ids = Object.keys(sess.firstTry);
  if (sess.unit){
    const u = UNITS.find(u => u.id === sess.unit);
    u.items.concat(ids).forEach(id => { if (!S.srs[id] && ITEMS[id]) S.srs[id] = {b:1, due: today() + 1}; });
    ids.forEach(id => { if (!sess.firstTry[id]) S.srs[id] = {b:1, due: today()}; });
    S.done[sess.unit] = (S.done[sess.unit] || 0) + 1;
    S.xp += 10;
  } else {
    ids.forEach(id => srsMark(id, sess.firstTry[id]));
    S.xp += 5;
  }
  const pct = Math.round(100 * sess.firstOk / Math.max(1, sess.firstN));
  let lvMsg = '';
  if (sess.unit){
    const L = lvState(sess.unit), lv = sess.level || 1;
    L.best[lv] = Math.max(L.best[lv] || 0, pct);
    if (lv < 3 && pct >= PASS_PCT && L.un <= lv){
      L.un = lv + 1; L.sel = lv + 1;
      lvMsg = `<div class="unlock"><b>Nivel ${lv + 1} desbloqueado</b><span>${lv + 1 === 2 ? (LANG === 'fr' ? 'Sin pronunciación escrita y con más dictados.' : 'Sin pinyin y con más dictados.') : (LANG === 'fr' ? 'Frases nuevas cada vez.' : 'Frases nuevas cada vez, sin pinyin.')} Queda seleccionado para la próxima vez. Puedes volver a un nivel anterior cuando quieras.</span></div>`;
    } else if (lv < 3 && L.un <= lv){
      lvMsg = `<div class="hint">Con ${PASS_PCT}% o más desbloqueas el nivel ${lv + 1}. Esta vez: ${pct}%.</div>`;
    }
  }
  if (sess.exam){ const key = sess.examKey || 'examBest'; S[key] = Math.max(S[key] || 0, pct); }
  bumpStreak(); save();
  screen = 'result';
  const due = dueIds().length;
  app.innerHTML = `<div class="result"><div class="eyebrow">${esc(sess.title)} · terminado</div><div class="big">${pct}%</div><div class="es">acertaste al primer intento</div>${lvMsg}
    <div class="row"><span class="chip">${ICON.fire} racha de ${S.streak} día${S.streak === 1 ? '' : 's'}</span><span class="chip">${ICON.star} ${S.xp} XP</span></div>
    ${sess.misses.length ? `<div class="misslist"><div class="kind" style="border:0;background:none;padding:0">Para repasar (vuelven en tu próximo repaso)</div>${sess.misses.slice(0, 8).map(r => `<div><span class="han">${esc(r.h)}</span><span>${pyHTML(r.p)}</span><span class="muted">${esc(r.es)}</span></div>`).join('')}</div>` : ''}
    <div class="row">${due ? `<button class="btn main" id="goRev">Repasar ${due} pendientes</button>` : ''}<button class="btn" id="goHome">Volver al inicio</button></div></div>`;
  app.addEventListener('click', function once(e){ if (e.target.id === 'goHome'){ app.removeEventListener('click', once); screen = 'home'; renderHome(); } if (e.target.id === 'goRev'){ app.removeEventListener('click', once); startSession(reviewPlan()); } });
}

/* ---------- 逢七过 game ---------- */
let g7 = null;
const isSeven = n => n % 7 === 0 || String(n).includes('7');
function startG7(){
  screen = 'g7'; g7 = {n:1, timer:null};
  app.innerHTML = `<div class="sbar"><button class="xbtn" id="quit" aria-label="Salir">${ICON.x}</button><div style="flex:1"></div><span class="chip">${ICON.star} récord ${S.best7}</span></div>
  <div class="card center"><div class="kind">Juego · 逢七过 féng qī guò</div><h2>No digas siete</h2>
  <p class="es">Se cuenta en voz alta. Cuando el número es múltiplo de 7 o lleva un 7 (7, 14, 17, 21…), no se dice: se aplaude. Elige la forma correcta antes de que se acabe el tiempo.</p>
  <button class="btn main big" id="g7go">Empezar</button></div>`;
  bindQuit();
  document.getElementById('g7go').onclick = g7Step;
}
function g7Step(){
  const n = g7.n;
  const near = [n + 1, n - 1, n + 10, n - 10, Number(String(n).split('').reverse().join(''))].filter(x => x > 0 && x < 100 && x !== n && numZh(x) !== numZh(n));
  const opts = shuffle([n, ...shuffle([...new Set(near)]).slice(0, 2)]);
  const limit = Math.max(2.6, 5 - n * 0.05);
  app.innerHTML = `<div class="sbar"><button class="xbtn" id="quit" aria-label="Salir">${ICON.x}</button><div style="flex:1"></div><span class="chip">${ICON.star} récord ${S.best7}</span></div>
  <div class="card center"><div class="kind">Turno ${n}</div><div class="g7num">${n}</div><div class="timer"><i id="g7t" style="width:100%"></i></div>
  <div class="opts" style="width:100%">${opts.map(x => `<button class="opt" data-v="${x}"><span class="han">${numZh(x)}</span></button>`).join('')}<button class="clap" data-v="clap">拍手 · aplaudir</button></div></div>`;
  bindQuit();
  const t0 = performance.now(), bar = document.getElementById('g7t');
  const tick = () => { if (screen !== 'g7' || g7.n !== n) return; const f = 1 - (performance.now() - t0) / (limit * 1000); if (f <= 0) return g7Over(n, 'Se acabó el tiempo'); bar.style.width = (f * 100) + '%'; g7.timer = requestAnimationFrame(tick); };
  g7.timer = requestAnimationFrame(tick);
  app.querySelectorAll('[data-v]').forEach(b => b.onclick = () => {
    if (g7.n !== n) return;
    const v = b.dataset.v, ok = isSeven(n) ? v === 'clap' : v === String(n);
    cancelAnimationFrame(g7.timer);
    if (!ok) return g7Over(n, isSeven(n) ? `El ${n} ${n % 7 === 0 ? 'es múltiplo de 7' : 'lleva un 7'}: tocaba aplaudir.` : 'Ese no era el número.');
    if (!isSeven(n)) say(numZh(n), 1.1);
    g7.n++; g7Step();
  });
}
function g7Over(n, why){
  cancelAnimationFrame(g7.timer);
  const score = n - 1, rec = score > S.best7;
  if (rec) S.best7 = score;
  S.xp += Math.floor(score / 5); bumpStreak(); save();
  g7.n = -1;
  app.innerHTML = `<div class="result"><div class="eyebrow">逢七过 · fin</div><div class="big">${score}</div><div class="es">${rec ? '¡Nuevo récord!' : 'números seguidos'}</div>
  <p class="es">${esc(why)}</p>${isSeven(n) ? '' : revHTML({h:numZh(n), p:numPy(n), es:String(n)})}
  <div class="row"><button class="btn main" id="again">Otra vez</button><button class="btn" id="home">Volver al inicio</button></div></div>`;
  document.getElementById('again').onclick = startG7;
  document.getElementById('home').onclick = () => { screen = 'home'; renderHome(); };
}

   Prefix D = deflate-raw, J = plain JSON for browsers without CompressionStream. */
const b64u = bytes => { let s = ''; for (const b of bytes) s += String.fromCharCode(b); return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); };

async function exportCode(){

  delete o.updatedAt;
  const raw = new TextEncoder().encode(JSON.stringify(o));
  if (typeof CompressionStream !== 'undefined'){ try { return 'D' + b64u(await pipeBytes(raw, new CompressionStream('deflate-raw'))); } catch(e) {} }

}
async function importCode(text){

}

  const N = fresh();
  if (MODULES[o.mod]) N.mod = o.mod;

  N.xp = int(o.xp, 0, 1e7); N.streak = int(o.streak, 0, 1e5); N.best7 = int(o.best7, 0, 1e4);
  if (num(o.lastDay)) N.lastDay = Math.round(o.lastDay);
  [...new Set(['examBest', 'examBest1', 'examBest3', 'examBest4', 'examBest5', 'examBest6', 'examBest7', 'examHSK1', ...Object.values(MODULES).map(m => m.examKey)])].forEach(k => { if (num(o[k])) N[k] = int(o[k], 0, 100); });
  for (const u of UNITS){
    if (o.done && o.done[u.id]) N.done[u.id] = int(o.done[u.id], 1, 1e5);
    const L = o.lvl && o.lvl[u.id];
    if (L && typeof L === 'object'){
      const un = int(L.un, 1, 3), best = {};
      [1, 2, 3].forEach(n => { if (L.best && num(L.best[n])) best[n] = int(L.best[n], 0, 100); });

function frNum(n){

  for (const x of shuffle([n + 10, n - 10, n + 20, n - 20, rv, n % 10, n + 1, n - 1]).concat([n + 10, n - 10])) if (x >= lo && x <= hi && x !== n && !out.includes(x)) out.push(x);

function frDialogPlan(list, item){

/* ---------- engine pieces that depend on the language ---------- */
function frOthers(it, n){
  const fair = x => x.kind === 'word' && x.id !== it.id && x.h !== it.h && x.es !== it.es && loose(x.p) !== loose(it.p) && loose(x.h) !== loose(it.h);
  const all = Object.values(ITEMS).filter(fair);
  const tiers = [all.filter(x => x.unit === it.unit && x.cat === it.cat), all.filter(x => x.unit === it.unit), all.filter(x => x.cat === it.cat), all];
  const out = [];
  for (const t of tiers) for (const x of shuffle(t)) if (out.length < n && !out.includes(x) && !out.some(o => o.h === x.h || o.es === x.es || loose(o.p) === loose(x.p))) out.push(x);
  return out;
}
wordEx = function(it, mode){
  if (mode === 'hanzi') mode = 'pick';
  if (mode === 'chars') mode = 'dict';
  const all = shuffle([it, ...frOthers(it, 3)]);
  const rev = {h:it.h, p:it.p, es:it.es};
  const frO = x => ({v:x.id, say:x.h, html:`<span class="han">${esc(x.h)}</span>${LV >= 2 ? '' : `<small>${pyHTML(x.p)}</small>`}`});
  const wide = all.some(x => x.h.length > 14);
  switch (mode){
    case 'meaning': return {t:'mc', item:it.id, kind:'¿Qué significa?', say:it.h, q:`<div class="frbig han">${esc(it.h)}</div><div class="pybig">${pyHint(it.p)}</div>${audioBtns(it.h)}`,
      options:all.map(x => ({v:x.id, html:esc(x.es)})), answer:it.id, rev, wide:all.some(x => x.es.length > 16)};
    case 'pick': return {t:'mc', item:it.id, kind:'Elige en francés', q:fcue(it.es), options:all.map(frO), answer:it.id, rev, wide};
    case 'listen': return {t:'mc', item:it.id, kind:'Escucha y elige', say:it.h, q:audioBtns(it.h, true), options:all.map(frO), answer:it.id, rev, wide};
    case 'type': return {t:'type', item:it.id, kind:'Escríbelo en francés', q:`${fcue(it.es)}${LV < 2 ? audioBtns(it.h) : ''}`, answer:it.h, ph:'Escribe en francés', hint:FR_TYPE_HINT, rev};
    case 'dict': return {t:'type', item:it.id, kind:'Dictado: escribe lo que oyes', say:it.h, q:audioBtns(it.h), answer:it.h, ph:'Escribe en francés', hint:FR_TYPE_HINT, rev};
    default: return {t:'speak', item:it.id, kind:'Dilo en voz alta', q:`${fcue(it.es)}<div class="hint">Dilo en francés antes de ver la respuesta. Recordar sin pistas es lo que fija la palabra.</div>`, rev};
  }
};
sentEx = function(it, mode){
  if (mode === 'speak') return fSpeak(it.id, it.es, it.s);
  if (mode === 'listen') return fTiles(it.id, 'Escucha y ordena', audioBtns(it.h), it.s, it.es, it.traps, it.alts, {say:it.h});
  return fTiles(it.id, 'Tradúcelo al francés', fcue(it.es), it.s, it.es, it.traps, it.alts);
};
const FR_PRON = [['ü', 'tu', 'di «i» con los labios redondos de «u»'], ['ö', 'deux', 'di «e» con los labios redondos'], ['ë', 'je', 'una e corta y relajada'],
  ['zh', 'bonjour', 'como la «ll» de Buenos Aires: zumba'], ['sh', 'chinois', 'como cuando pides silencio: «shhh»'], ['ã · õ · ẽ', 'enfant · bon · vin', 'vocales nasales: el aire sale por la nariz y la n no suena'],
  ['r', 'merci', 'en la garganta, parecida a una j suave'], ['è · é', 'très · été', 'è abierta; é cerrada, como sonriendo']];
const baseCard = cardHTML;
cardHTML = function(c){
  if (c.type === 'word'){
    const it = ITEMS[c.id];
    return `<div class="card center"><div class="kind">Palabra nueva</div><div class="frbig han">${esc(it.h)}</div><div class="pybig">${pyHTML(it.p)}</div>${audioBtns(it.h)}<div class="es">${esc(it.es)}</div>${it.tip ? `<div class="tip">${esc(it.tip)}</div>` : ''}</div>`;
  }
  if (c.type === 'sent'){
    const it = ITEMS[c.id];
    return `<div class="card center"><div class="kind">Frase modelo</div><div class="frbig han" style="font-size:30px">${esc(it.h)}</div>${audioBtns(it.h)}<div class="es">${esc(it.es)}</div></div>`;
  }
  if (c.type === 'frpron') return `<div class="card center"><div class="kind">Antes de empezar</div><h2>Cómo leer la pronunciación</h2>
    <p class="es">Debajo de cada palabra ves cómo suena, con letras del español. Las sílabas van separadas por «·» y el acento cae siempre en la última.</p>
    <div class="rules">${FR_PRON.map(r => `<div class="rule"><div><b class="pron">${esc(r[0])}</b> <span class="han">${esc(r[1])}</span><div class="muted">${esc(r[2])}</div></div><button class="audio" data-say="${esc(r[1].replace(/ · /g, ', '))}" aria-label="Escuchar">${ICON.play}</button></div>`).join('')}</div>
    <div class="tip">Es solo una ayuda: escucha siempre el audio. Desde el nivel 2 ya no aparece.</div></div>`;
  if (c.type === 'lvl') return c.lv === 2
    ? `<div class="card center"><div class="kind">Nivel 2</div><h2>Sin pronunciación escrita, más oído</h2>
      <p class="es">Ya no ves cómo suena cada palabra: la reconoces al oírla. Hay más dictados y escribes las palabras completas.</p>
      <div class="tip">Después de cada respuesta sigues viendo la pronunciación, para corregirte.</div></div>`
    : `<div class="card center"><div class="kind">Nivel 3</div><h2>Frases que nunca viste</h2>
      <p class="es">Cada vez se generan frases nuevas con lo de la unidad: otros nombres, números, países y personas. Respondes y preguntas.</p>
      <div class="tip">No memorices frases: aplica la regla de la unidad.</div></div>`;
  return baseCard(c);
};
